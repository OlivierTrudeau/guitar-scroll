<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a2e">
  <title>GuitarScroll</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- SONG LIST VIEW -->
    <div id="library-view" class="view active">
      <header class="top-bar">
        <h1>GuitarScroll</h1>
        <button id="tuner-btn" class="text-btn" aria-label="Tuner">Tuner</button>
        <button id="add-song-btn" class="icon-btn" aria-label="Add song">＋</button>
        <button id="menu-btn" class="icon-btn" aria-label="Menu">⋯</button>
      </header>
      <div id="menu-dropdown" class="menu-dropdown hidden">
        <button id="export-btn" class="menu-item">Export backup</button>
        <button id="import-btn" class="menu-item">Import backup</button>
        <input id="import-file" type="file" accept=".json" hidden>
      </div>
      <!-- Duolingo-style daily practice summary -->
      <div id="streak-banner" class="streak-banner">
        <div class="streak-stat">
          <span id="streak-count" class="streak-num">0</span>
          <span class="streak-label">🔥 day streak</span>
        </div>
        <div class="streak-stat">
          <span id="today-count" class="streak-num">0</span>
          <span class="streak-label">🎸 played today</span>
        </div>
        <div class="streak-stat">
          <span id="total-count" class="streak-num">0</span>
          <span class="streak-label">✅ total sessions</span>
        </div>
      </div>
      <div class="filter-bar">
        <input id="search-input" type="text" placeholder="Search songs..." autocomplete="off">
        <div id="proficiency-filter" class="proficiency-filter">
          <button class="filter-pill active" data-level="all">All</button>
          <button class="filter-pill" data-level="1">1</button>
          <button class="filter-pill" data-level="2">2</button>
          <button class="filter-pill" data-level="3">3</button>
          <button class="filter-pill" data-level="4">4</button>
          <button class="filter-pill" data-level="5">5</button>
          <button class="filter-pill" data-level="0">Unrated</button>
        </div>
        <div id="sort-filter" class="proficiency-filter">
          <button class="filter-pill sort-pill active" data-sort="default">Default</button>
          <button class="filter-pill sort-pill" data-sort="rusty">🕸️ Least recent</button>
          <button class="filter-pill sort-pill" data-sort="recent">Recently played</button>
          <button class="filter-pill sort-pill" data-sort="most">🎸 Most practiced</button>
        </div>
      </div>
      <div id="song-list" class="song-list"></div>
      <div id="empty-state" class="empty-state">
        <p>No songs yet</p>
        <p class="sub">Tap ＋ to add your first song</p>
      </div>
    </div>

    <!-- ADD / EDIT SONG VIEW -->
    <div id="edit-view" class="view">
      <header class="top-bar">
        <button id="edit-back-btn" class="icon-btn" aria-label="Back">←</button>
        <h1 id="edit-title">Add Song</h1>
        <button id="save-song-btn" class="icon-btn" aria-label="Save">✓</button>
      </header>
      <div class="edit-form">
        <input id="song-title-input" type="text" placeholder="Song title" autocomplete="off">
        <input id="song-artist-input" type="text" placeholder="Artist" autocomplete="off">
        <input id="song-capo-input" type="text" placeholder="Capo (e.g. 2nd fret)" autocomplete="off">
        <input id="song-tuning-input" type="text" placeholder="Tuning (e.g. Standard)" autocomplete="off">
        <input id="song-strum-input" type="text" placeholder="Strumming pattern (e.g. D DU UDU)" autocomplete="off">
        <div class="proficiency-edit">
          <label for="song-proficiency-input">How well do I know this?</label>
          <div id="proficiency-stars" class="proficiency-stars">
            <button type="button" class="star-btn" data-value="1">★</button>
            <button type="button" class="star-btn" data-value="2">★</button>
            <button type="button" class="star-btn" data-value="3">★</button>
            <button type="button" class="star-btn" data-value="4">★</button>
            <button type="button" class="star-btn" data-value="5">★</button>
          </div>
          <span id="proficiency-label" class="proficiency-label">Not rated</span>
        </div>
        <textarea id="song-body-input" placeholder="Paste chords & lyrics here...&#10;&#10;Supports formats like:&#10;&#10;[Verse 1]&#10;C              Am&#10;Heart on my sleeve&#10;&#10;Or inline: [C]Heart on my [Am]sleeve"></textarea>
      </div>
    </div>

    <!-- SONG PLAYER VIEW -->
    <div id="player-view" class="view">
      <header class="top-bar player-bar">
        <button id="player-back-btn" class="icon-btn" aria-label="Back">←</button>
        <div class="player-title-wrap">
          <h1 id="player-song-title"></h1>
          <span id="player-song-artist" class="artist-sub"></span>
        </div>
        <button id="stats-current-btn" class="icon-btn" aria-label="Practice stats">📊</button>
        <button id="edit-current-btn" class="icon-btn" aria-label="Edit">✎</button>
      </header>
      <div id="song-meta" class="song-meta"></div>
      <div id="song-content" class="song-content"></div>
      <div id="scroll-controls" class="scroll-controls">
        <button id="scroll-slower" class="ctrl-btn">−</button>
        <button id="scroll-toggle" class="ctrl-btn play-btn">▶</button>
        <button id="scroll-faster" class="ctrl-btn">＋</button>
        <span id="speed-label" class="speed-label">1.0×</span>
      </div>
    </div>

    <!-- PRACTICE STATS VIEW -->
    <div id="stats-view" class="view">
      <header class="top-bar">
        <button id="stats-back-btn" class="icon-btn" aria-label="Back">←</button>
        <div class="player-title-wrap">
          <h1 id="stats-song-title"></h1>
          <span id="stats-song-artist" class="artist-sub"></span>
        </div>
      </header>
      <div class="stats-body">
        <div class="stats-cards">
          <div class="stats-card">
            <span id="stats-total" class="stats-num">0</span>
            <span class="stats-card-label">Times practiced</span>
          </div>
          <div class="stats-card">
            <span id="stats-streak" class="stats-num">0</span>
            <span class="stats-card-label">Day streak</span>
          </div>
          <div class="stats-card">
            <span id="stats-last" class="stats-num">–</span>
            <span class="stats-card-label">Last played</span>
          </div>
        </div>
        <h2 class="stats-heading">Practice calendar</h2>
        <div id="stats-calendar" class="calendar"></div>
        <p class="calendar-legend">
          <span class="cal-cell lvl-0"></span> none
          <span class="cal-cell lvl-1"></span>
          <span class="cal-cell lvl-2"></span>
          <span class="cal-cell lvl-3"></span> more
        </p>
      </div>
    </div>

    <!-- TUNER VIEW -->
    <div id="tuner-view" class="view">
      <header class="top-bar">
        <button id="tuner-back-btn" class="icon-btn" aria-label="Back">←</button>
        <h1>Tuner</h1>
      </header>
      <div class="tuner-body">
        <!-- Big note readout + cents deviation dial -->
        <div class="tuner-note-wrap">
          <div id="tuner-note" class="tuner-note">—</div>
          <div id="tuner-freq" class="tuner-freq">Tap start & play a string</div>
        </div>

        <!-- Needle gauge: center = in tune, left = flat, right = sharp -->
        <div class="tuner-gauge">
          <div class="gauge-ticks">
            <span class="tick tick-edge">-50</span>
            <span class="tick">-25</span>
            <span class="tick tick-center">0</span>
            <span class="tick">+25</span>
            <span class="tick tick-edge">+50</span>
          </div>
          <div class="gauge-track">
            <div class="gauge-center-line"></div>
            <div id="tuner-needle" class="gauge-needle"></div>
          </div>
          <div id="tuner-status" class="tuner-status">—</div>
        </div>

        <!-- Standard tuning reference strings; highlights the closest one -->
        <div class="tuner-strings">
          <button class="tuner-string" data-note="E2">E<sub>2</sub></button>
          <button class="tuner-string" data-note="A2">A<sub>2</sub></button>
          <button class="tuner-string" data-note="D3">D<sub>3</sub></button>
          <button class="tuner-string" data-note="G3">G<sub>3</sub></button>
          <button class="tuner-string" data-note="B3">B<sub>3</sub></button>
          <button class="tuner-string" data-note="E4">E<sub>4</sub></button>
        </div>

        <button id="tuner-toggle" class="tuner-start-btn">Start tuner</button>
        <p id="tuner-msg" class="tuner-msg"></p>
      </div>
    </div>

  </div>
  <script src="analytics.js"></script>
  <script src="app.js"></script>
</body>
</html>
